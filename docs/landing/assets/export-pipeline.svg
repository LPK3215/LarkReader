<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7F97"/>
</marker>
</defs>
<rect x="0" y="0" width="1200" height="640" rx="0" ry="0" fill="#0B1220" stroke="none" stroke-width="1"/>
<text x="40" y="34" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="start">导出流水线 · 从 URL 到本地文件</text>
<text x="1160" y="34" font-size="12" fill="#6B7F97" font-weight="400" text-anchor="end">Wiki 批量与单文档共用同一落盘链路</text>
<rect x="120" y="76" width="280" height="96" rx="12" ry="12" fill="#16212F" stroke="#4C8DFF" stroke-width="1"/>
<rect x="120" y="76" width="4" height="96" rx="2" fill="#4C8DFF"/>
<text x="140" y="102" font-size="11.5" fill="#6B7F97" font-weight="600" text-anchor="start">STEP 1</text>
<text x="140" y="126" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start">输入</text>
<text x="140" y="144" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">Wiki / 文档 URL 或节点 token</text>
<text x="140" y="160" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">支持 space、单节点、父文档带子页</text>
<rect x="460" y="76" width="280" height="96" rx="12" ry="12" fill="#16212F" stroke="#A97BFF" stroke-width="1"/>
<rect x="460" y="76" width="4" height="96" rx="2" fill="#A97BFF"/>
<text x="480" y="102" font-size="11.5" fill="#6B7F97" font-weight="600" text-anchor="start">STEP 2</text>
<text x="480" y="126" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start">环境与登录检测</text>
<text x="480" y="144" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">Node / lark-cli / 应用配置 / 登录状态</text>
<text x="480" y="160" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">并行执行，区分 5 种异常状态</text>
<rect x="800" y="76" width="280" height="96" rx="12" ry="12" fill="#16212F" stroke="#4C8DFF" stroke-width="1"/>
<rect x="800" y="76" width="4" height="96" rx="2" fill="#4C8DFF"/>
<text x="820" y="102" font-size="11.5" fill="#6B7F97" font-weight="600" text-anchor="start">STEP 3</text>
<text x="820" y="126" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start">Wiki 递归遍历</text>
<text x="820" y="144" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">保留目录层级与飞书排序 · 深度 ≤ 64</text>
<text x="820" y="160" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">节点上限 10,000 · 选文件夹自动含后代</text>
<line x1="400" y1="124" x2="454" y2="124" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="740" y1="124" x2="794" y2="124" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="940" y1="172" x2="940" y2="204" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="165.0" y1="204" x2="1035.0" y2="204" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="165.0" y1="204" x2="165.0" y2="232" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="455.0" y1="204" x2="455.0" y2="232" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="745.0" y1="204" x2="745.0" y2="232" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="1035.0" y1="204" x2="1035.0" y2="232" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="238" width="250" height="100" rx="12" ry="12" fill="#16212F" stroke="#3FCF8E" stroke-width="1"/>
<rect x="40" y="238" width="4" height="100" rx="2" fill="#3FCF8E"/>
<text x="58" y="266" font-size="14" fill="#3FCF8E" font-weight="700" text-anchor="start">Doc</text>
<text x="58" y="290" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="start">→ Markdown + 图片</text>
<text x="58" y="312" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">图片并发下载（1–32）并本地化 URL</text>
<text x="58" y="328" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">同名自动 (2)(3) 编号，不覆盖</text>
<rect x="330" y="238" width="250" height="100" rx="12" ry="12" fill="#16212F" stroke="#FFB454" stroke-width="1"/>
<rect x="330" y="238" width="4" height="100" rx="2" fill="#FFB454"/>
<text x="348" y="266" font-size="14" fill="#FFB454" font-weight="700" text-anchor="start">Sheet</text>
<text x="348" y="290" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="start">→ XLSX</text>
<text x="348" y="312" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">整表导出，保留数值与表头</text>
<text x="348" y="328" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">写命令受 cwd 白名单约束</text>
<rect x="620" y="238" width="250" height="100" rx="12" ry="12" fill="#16212F" stroke="#A97BFF" stroke-width="1"/>
<rect x="620" y="238" width="4" height="100" rx="2" fill="#A97BFF"/>
<text x="638" y="266" font-size="14" fill="#A97BFF" font-weight="700" text-anchor="start">Bitable</text>
<text x="638" y="290" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="start">→ NDJSON</text>
<text x="638" y="312" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">每张数据表一份 NDJSON</text>
<text x="638" y="328" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">附带同表名 .manifest.json 元数据</text>
<rect x="910" y="238" width="250" height="100" rx="12" ry="12" fill="#16212F" stroke="#FFB454" stroke-width="1"/>
<rect x="910" y="238" width="4" height="100" rx="2" fill="#FFB454"/>
<text x="928" y="266" font-size="14" fill="#FFB454" font-weight="700" text-anchor="start">File 附件</text>
<text x="928" y="290" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="start">→ 原样字节</text>
<text x="928" y="312" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">位置前缀 + 原标题 + 原扩展名</text>
<text x="928" y="328" font-size="11" fill="#93A6BD" font-weight="400" text-anchor="start">字节级往返一致，支持 zip/pdf/docx</text>
<line x1="165.0" y1="338" x2="165.0" y2="370" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="455.0" y1="338" x2="455.0" y2="370" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="745.0" y1="338" x2="745.0" y2="370" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="1035.0" y1="338" x2="1035.0" y2="370" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="165.0" y1="370" x2="600" y2="370" stroke="#6B7F97" stroke-width="1.6"/>
<line x1="600" y1="370" x2="600" y2="390" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="320" y="396" width="560" height="96" rx="12" ry="12" fill="#16212F" stroke="#3FCF8E" stroke-width="1"/>
<rect x="320" y="396" width="4" height="96" rx="2" fill="#3FCF8E"/>
<text x="340" y="422" font-size="11.5" fill="#6B7F97" font-weight="600" text-anchor="start">STEP 4</text>
<text x="340" y="446" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start">事务提交与安全落盘</text>
<text x="340" y="464" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">先写临时文件 → 原子 rename 落盘 → 目录预检可写性 + 磁盘空间</text>
<text x="340" y="480" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">失败回滚，不会留下半截文件</text>
<line x1="600" y1="492" x2="600" y2="510" stroke="#6B7F97" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="220" y="516" width="760" height="96" rx="12" ry="12" fill="#16212F" stroke="#4C8DFF" stroke-width="1"/>
<rect x="220" y="516" width="4" height="96" rx="2" fill="#4C8DFF"/>
<text x="240" y="542" font-size="11.5" fill="#6B7F97" font-weight="600" text-anchor="start">STEP 5</text>
<text x="240" y="566" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start">统一结果与任务体验</text>
<text x="240" y="584" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">items 统一列表 · 后台任务 8 阶段进度 · 协作式取消 · 部分成功如实上报</text>
<text x="240" y="600" font-size="11.5" fill="#93A6BD" font-weight="400" text-anchor="start">历史持久化：最近 24 小时 / 最多 100 条</text>
</svg>
